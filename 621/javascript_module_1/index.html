<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск внутри элемента</title>
</head>
<body>
    <section id="catalog">
        <p class="item">Ноутбук</p>
        <p class="item">Телефон</p>
    </section>

    <section id="cart">
        <p class="item">Клавиатура</p>
    </section>

    <script>
        const catalog = document.querySelector("#catalog");

        const items = catalog.querySelectorAll(".item");

        console.log(items.length); // 2

        items.forEach(item => {
            console.log(item.textContent);
        });
    </script>
</body>
</html>
