<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач с сохранением</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        li {
            margin-bottom: 12px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Менеджер задач</h1>

    <form id="task-form" novalidate>
        <input
            id="task-input"
            type="text"
            placeholder="Введите задачу"
            maxlength="100"
        >

        <button type="submit">Добавить</button>
    </form>

    <p id="input-error" class="error"></p>
    <p id="storage-message" role="status"></p>

    <p id="summary"></p>

    <ul id="task-list"></ul>

    <button id="clear-completed" type="button">
        Удалить выполненные
    </button>

    <script>
        const STORAGE_KEY = "js-course-tasks-v1";

        const form = document.querySelector("#task-form");
        const taskInput = document.querySelector("#task-input");

        const taskList = document.querySelector("#task-list");
        const summary = document.querySelector("#summary");

        const inputError = document.querySelector("#input-error");
        const storageMessage = document.querySelector("#storage-message");

        const clearButton = document.querySelector("#clear-completed");

        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (saved === null) {
                    return [];
                }

                const data = JSON.parse(saved);

                if (!Array.isArray(data)) {
                    return [];
                }

                return data.filter(task => {
                    return (
                        task !== null &&
                        typeof task === "object" &&
                        Number.isInteger(task.id) &&
                        task.id > 0 &&
                        typeof task.title === "string" &&
                        typeof task.completed === "boolean"
                    );
                });
            } catch (error) {
                storageMessage.textContent =
                    "Не удалось прочитать сохранённые задачи";

                return [];
            }
        }

        let tasks = loadTasks();

        let nextId = tasks.reduce(
            (maxId, task) => Math.max(maxId, task.id),
            0
        ) + 1;

        function saveTasks() {
            try {
                const json = JSON.stringify(tasks);

                localStorage.setItem(STORAGE_KEY, json);

                storageMessage.textContent = "";
            } catch (error) {
                storageMessage.textContent =
                    "Не удалось сохранить изменения";
            }
        }

        function renderTasks() {
            taskList.replaceChildren();

            for (const task of tasks) {
                const item = document.createElement("li");

                const label = document.createElement("label");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                checkbox.dataset.action = "toggle";
                checkbox.dataset.id = task.id;

                const title = document.createElement("span");
                title.textContent = " " + task.title;

                if (task.completed) {
                    title.classList.add("completed");
                }

                label.append(checkbox, title);

                const deleteButton = document.createElement("button");

                deleteButton.type = "button";
                deleteButton.textContent = "Удалить";

                deleteButton.dataset.action = "delete";
                deleteButton.dataset.id = task.id;

                item.append(
                    label,
                    document.createTextNode(" "),
                    deleteButton
                );

                taskList.append(item);
            }

            const completedCount = tasks.filter(
                task => task.completed
            ).length;

            summary.textContent =
                `Всего: ${tasks.length}. ` +
                `Выполнено: ${completedCount}`;

            clearButton.disabled = completedCount === 0;
        }

        form.addEventListener("submit", event => {
            event.preventDefault();

            const title = taskInput.value.trim();

            if (title.length === 0) {
                inputError.textContent =
                    "Название задачи не может быть пустым";

                return;
            }

            inputError.textContent = "";

            const newTask = {
                id: nextId++,
                title: title,
                completed: false
            };

            tasks.push(newTask);

            saveTasks();
            renderTasks();

            form.reset();
            taskInput.focus();
        });

        taskList.addEventListener("change", event => {
            const checkbox = event.target;

            if (!checkbox.matches(
                'input[data-action="toggle"]'
            )) {
                return;
            }

            const id = Number(checkbox.dataset.id);

            const task = tasks.find(task => task.id === id);

            if (!task) {
                return;
            }

            task.completed = checkbox.checked;

            saveTasks();
            renderTasks();
        });

        taskList.addEventListener("click", event => {
            const button = event.target.closest(
                'button[data-action="delete"]'
            );

            if (!button || !taskList.contains(button)) {
                return;
            }

            const id = Number(button.dataset.id);

            tasks = tasks.filter(task => task.id !== id);

            saveTasks();
            renderTasks();
        });

        clearButton.addEventListener("click", () => {
            tasks = tasks.filter(task => !task.completed);

            saveTasks();
            renderTasks();
        });

        renderTasks();
    </script>
</body>
</html>
