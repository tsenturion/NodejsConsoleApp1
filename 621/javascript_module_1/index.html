<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Работа с DOM</title>
</head>
<body>
    <h1 id="title">Старый заголовок</h1>
    <p id="description">Исходный текст</p>

    <script>
        const title = document.getElementById("title");
        const description = document.getElementById("description");

        title.textContent = "Изучаем JavaScript DOM";
        description.textContent = "Этот текст изменён через JavaScript";
    </script>
</body>
</html>
