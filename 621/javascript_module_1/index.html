<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователей через API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        #users-container {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 15px;
        }

        .user-card {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 15px;
        }

        .user-card h2 {
            margin-top: 0;
        }

        .error {
            color: #c00000;
        }
    </style>
</head>
<body>
    <h1>Каталог пользователей</h1>

    <div class="controls">
        <input
            id="search-input"
            type="text"
            placeholder="Поиск по имени или email"
        >

        <button id="reload-button" type="button">
            Обновить
        </button>
    </div>

    <p id="status" role="status"></p>
    <p id="count"></p>

    <div id="users-container"></div>

    <script>
        const API_URL =
            "https://jsonplaceholder.typicode.com/users";

        const searchInput = document.querySelector("#search-input");
        const reloadButton = document.querySelector("#reload-button");

        const status = document.querySelector("#status");
        const count = document.querySelector("#count");

        const container = document.querySelector("#users-container");

        let users = [];

        function createUserCard(user) {
            const card = document.createElement("article");
            card.classList.add("user-card");

            const name = document.createElement("h2");
            name.textContent = user.name;

            const email = document.createElement("p");
            email.textContent = `Email: ${user.email}`;

            const username = document.createElement("p");
            username.textContent =
                `Логин: ${user.username}`;

            const city = document.createElement("p");
            city.textContent =
                `Город: ${user.address?.city ?? "Не указан"}`;

            const company = document.createElement("p");
            company.textContent =
                `Компания: ${user.company?.name ?? "Не указана"}`;

            card.append(
                name,
                email,
                username,
                city,
                company
            );

            return card;
        }

        function renderUsers() {
            const searchText = searchInput.value
                .trim()
                .toLowerCase();

            const filteredUsers = users.filter(user => {
                const name = user.name.toLowerCase();
                const email = user.email.toLowerCase();

                return (
                    name.includes(searchText) ||
                    email.includes(searchText)
                );
            });

            container.replaceChildren();

            const fragment = document.createDocumentFragment();

            for (const user of filteredUsers) {
                const card = createUserCard(user);
                fragment.append(card);
            }

            container.append(fragment);

            count.textContent =
                `Найдено пользователей: ${filteredUsers.length}`;
        }

        async function loadUsers() {
            reloadButton.disabled = true;
            searchInput.disabled = true;

            status.classList.remove("error");
            status.textContent = "Загрузка пользователей...";

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        `Сервер вернул статус ${response.status}`
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error(
                        "Сервер вернул данные неверного формата"
                    );
                }

                users = data;

                renderUsers();

                status.textContent =
                    "Пользователи успешно загружены";
            } catch (error) {
                users = [];

                renderUsers();

                status.classList.add("error");
                status.textContent =
                    `Ошибка загрузки: ${error.message}`;
            } finally {
                reloadButton.disabled = false;
                searchInput.disabled = false;
            }
        }

        searchInput.addEventListener("input", () => {
            renderUsers();
        });

        reloadButton.addEventListener("click", () => {
            loadUsers();
        });

        loadUsers();
    </script>
</body>
</html>
