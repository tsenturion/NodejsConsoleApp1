<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сохранение темы</title>

    <style>
        body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        body.dark {
            background-color: #202020;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Настройки оформления</h1>

    <label for="theme">Выберите тему:</label>

    <select id="theme">
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
    </select>

    <p>Выбранная тема сохранится после перезагрузки.</p>
    <p id="message" role="status"></p>

    <script>
        const themeSelect = document.querySelector("#theme");
        const message = document.querySelector("#message");

        const storageKey = "course-theme";

        function applyTheme(theme) {
            document.body.classList.toggle(
                "dark",
                theme === "dark"
            );
        }

        let savedTheme = "light";

        try {
            const value = localStorage.getItem(storageKey);

            if (value === "dark") {
                savedTheme = "dark";
            }
        } catch (error) {
            message.textContent =
                "Не удалось прочитать сохранённую тему";
        }

        themeSelect.value = savedTheme;
        applyTheme(savedTheme);

        themeSelect.addEventListener("change", () => {
            const selectedTheme = themeSelect.value;

            applyTheme(selectedTheme);

            try {
                localStorage.setItem(storageKey, selectedTheme);
                message.textContent = "Тема сохранена";
            } catch (error) {
                message.textContent =
                    "Не удалось сохранить выбранную тему";
            }
        });
    </script>
</body>
</html>
