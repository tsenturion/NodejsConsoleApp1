<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление элементов</title>
</head>
<body>
    <div id="catalog">
        <p id="old-product">Устаревший товар</p>
        <p>Новый товар</p>
    </div>

    <script>
        const oldProduct = document.querySelector("#old-product");

        oldProduct.remove();
    </script>
</body>
</html>
