<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление и удаление</title>
</head>
<body>
    <div id="messages">
        <p>Второе сообщение</p>
    </div>

    <script>
        const container = document.querySelector("#messages");

        const firstMessage = document.createElement("p");
        firstMessage.textContent = "Первое сообщение";

        container.prepend(firstMessage);

        const thirdMessage = document.createElement("p");
        thirdMessage.textContent = "Третье сообщение";

        container.append(thirdMessage);
    </script>
</body>
</html>
