<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>textContent и innerHTML</title>
</head>
<body>
    <div id="first"></div>
    <div id="second"></div>

    <script>
        const first = document.querySelector("#first");
        const second = document.querySelector("#second");

        first.textContent = "<strong>Привет!</strong>";
        second.innerHTML = "<strong>Привет!</strong>";
    </script>
</body>
</html>
