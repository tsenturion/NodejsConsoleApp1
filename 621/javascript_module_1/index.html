<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск нескольких элементов</title>
</head>
<body>
    <h1>Каталог</h1>

    <p class="price">1000</p>
    <p class="price">2500</p>
    <p class="price">1800</p>

    <script>
        const prices = document.querySelectorAll(".price");

        console.log(prices.length); // 3

        prices.forEach(element => {
            const price = Number(element.textContent);
            element.textContent = `${price} руб.`;
        });
    </script>
</body>
</html>
