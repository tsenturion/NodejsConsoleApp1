<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление состоянием</title>
</head>
<body>
    <h1>Расчёт стоимости обучения</h1>

    <label for="plan">Тариф:</label>
    <select id="plan">
        <option value="basic">Базовый — 3000 руб./мес.</option>
        <option value="premium">Премиум — 5000 руб./мес.</option>
    </select>

    <p>
        <label for="months">Количество месяцев:</label>
        <input
            id="months"
            type="number"
            min="1"
            max="24"
            value="1"
        >
    </p>

    <label>
        <input id="discount" type="checkbox">
        Применить скидку 10%
    </label>

    <h2 id="total"></h2>
    <p id="description"></p>

    <script>
        const initialState = {
            plan: "basic",
            months: 1,
            discount: false
        };

        const prices = {
            basic: 3000,
            premium: 5000
        };

        let state = initialState;

        const planSelect = document.querySelector("#plan");
        const monthsInput = document.querySelector("#months");
        const discountInput = document.querySelector("#discount");

        const totalElement = document.querySelector("#total");
        const description = document.querySelector("#description");

        function reducer(state, action) {
            switch (action.type) {
                case "plan/selected":
                    if (!Object.hasOwn(prices, action.payload)) {
                        return state;
                    }

                    return {
                        ...state,
                        plan: action.payload
                    };

                case "months/changed":
                    if (
                        !Number.isInteger(action.payload) ||
                        action.payload < 1 ||
                        action.payload > 24
                    ) {
                        return state;
                    }

                    return {
                        ...state,
                        months: action.payload
                    };

                case "discount/changed":
                    return {
                        ...state,
                        discount: action.payload
                    };

                default:
                    return state;
            }
        }

        function calculateTotal(state) {
            const subtotal = prices[state.plan] * state.months;

            return state.discount
                ? subtotal * 0.9
                : subtotal;
        }

        function render() {
            planSelect.value = state.plan;
            monthsInput.value = state.months;
            discountInput.checked = state.discount;

            const total = calculateTotal(state);

            totalElement.textContent =
                `Итого: ${total.toLocaleString("ru-RU")} руб.`;

            description.textContent =
                `Тариф: ${state.plan}, ` +
                `срок: ${state.months} мес., ` +
                `скидка: ${state.discount ? "есть" : "нет"}`;
        }

        function dispatch(action) {
            state = reducer(state, action);
            render();
        }

        planSelect.addEventListener("change", event => {
            dispatch({
                type: "plan/selected",
                payload: event.target.value
            });
        });

        monthsInput.addEventListener("change", event => {
            dispatch({
                type: "months/changed",
                payload: Number(event.target.value)
            });
        });

        discountInput.addEventListener("change", event => {
            dispatch({
                type: "discount/changed",
                payload: event.target.checked
            });
        });

        render();
    </script>
</body>
</html>
