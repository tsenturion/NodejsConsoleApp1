<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Компонентный подход</title>
    <style>
        .course-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
        }

        .selected {
            border-color: green;
            background: #e8ffe8;
        }
    </style>
</head>
<body>
    <h1>Выбор курса</h1>

    <p id="selected-info"></p>
    <div id="courses"></div>

    <script>
        const courses = [
            { id: 1, title: "JavaScript", hours: 40 },
            { id: 2, title: "React", hours: 32 },
            { id: 3, title: "TypeScript", hours: 24 }
        ];

        let selectedCourseId = null;

        const container = document.querySelector("#courses");
        const selectedInfo = document.querySelector("#selected-info");

        function createCourseCard({ course, selected, onSelect }) {
            const card = document.createElement("article");
            card.classList.add("course-card");

            if (selected) {
                card.classList.add("selected");
            }

            const title = document.createElement("h2");
            title.textContent = course.title;

            const duration = document.createElement("p");
            duration.textContent = `${course.hours} часов`;

            const button = document.createElement("button");
            button.type = "button";
            button.textContent = selected ? "Выбран" : "Выбрать";
            button.disabled = selected;

            button.addEventListener("click", () => {
                onSelect(course.id);
            });

            card.append(title, duration, button);

            return card;
        }

        function selectCourse(id) {
            selectedCourseId = id;
            render();
        }

        function render() {
            container.replaceChildren();

            const selectedCourse = courses.find(
                course => course.id === selectedCourseId
            );

            selectedInfo.textContent = selectedCourse
                ? `Вы выбрали: ${selectedCourse.title}`
                : "Курс пока не выбран";

            for (const course of courses) {
                const card = createCourseCard({
                    course,
                    selected: course.id === selectedCourseId,
                    onSelect: selectCourse
                });

                container.append(card);
            }
        }

        render();
    </script>
</body>
</html>
